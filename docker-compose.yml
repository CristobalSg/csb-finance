services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"

  printer:
    build:
      context: .
      dockerfile: printer-server/Dockerfile
    environment:
      PRINTER_SERVER_HOST: 0.0.0.0
      PRINTER_SERVER_PORT: 3001
      FRONTEND_ORIGIN: http://localhost:8080
      PRINTER_CONNECTION: ${PRINTER_CONNECTION:-network}
      PRINTER_HOST: ${PRINTER_HOST:-}
      PRINTER_PORT: ${PRINTER_PORT:-9100}
      PRINTER_NAME: ${PRINTER_NAME:-}
      PRINTER_USB_VENDOR_ID: ${PRINTER_USB_VENDOR_ID:-}
      PRINTER_USB_PRODUCT_ID: ${PRINTER_USB_PRODUCT_ID:-}
    ports:
      - "3001:3001"
    profiles:
      - printer
